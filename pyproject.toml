[project]
name = "em-baseline-earnings-summary"
version = "0.1.0b1"
description = "Summary baselines (gpt-5-nano, Gemini Flash-Lite) for the Explaining Markets competition, deployed on Modal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "modal>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "dspy>=3.0",
    "pydantic>=2.6",
    # Needed locally so `modal deploy` can read .env via Secret.from_dotenv.
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real model provider APIs; needs OPENAI_API_KEY / GEMINI_API_KEY (run with `pytest -m live`)",
]
filterwarnings = [
    # Third-party noise, not ours: dspy's own deprecated field args and
    # starlette's httpx transition notice.
    "ignore::DeprecationWarning:dspy",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.isort]
# Explicit so import grouping never depends on environment-sensitive
# first-party detection (bit us once: local cache vs CI disagreed).
known-first-party = ["em_baseline", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
files = ["src", "modal_app.py"]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dspy.*", "litellm.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/em_baseline"]
